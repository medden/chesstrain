[project]
name = "chesstrain"
version = "0.1.0"
description = "Personal opening repertoire trainer with spaced repetition"
requires-python = ">=3.11"
dependencies = ["chess>=1.10", "fsrs>=6", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
chesstrain = "chesstrain.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
