[project]
name = "chesstrain"
version = "0.1.0"
description = "Personal opening repertoire trainer with spaced repetition"
requires-python = ">=3.11"
dependencies = ["chess>=1.10", "fsrs>=6", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pre-commit"]

[project.scripts]
chesstrain = "chesstrain.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade, simplify, ruff-specific
select = ["F", "E", "W", "I", "B", "UP", "SIM", "RUF"]
# Chess and UI symbols (✓ ✗ … ×) are intentional in user-facing strings.
ignore = ["RUF001", "RUF002", "RUF003"]
