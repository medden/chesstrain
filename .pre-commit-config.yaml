# Runs the same checks as CI, using the project's .venv (see README "Setup").
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format --check
        entry: .venv/bin/ruff format --check
        language: system
        types: [python]
      - id: pytest
        name: pytest
        entry: .venv/bin/pytest -q -p no:warnings
        language: system
        pass_filenames: false
        always_run: true
